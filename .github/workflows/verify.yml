name: Verify handoff and bench firmware
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts-and-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: bash tools/verify.sh
  esp32-bench-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.18
      - run: pio run -d firmware -j 2
