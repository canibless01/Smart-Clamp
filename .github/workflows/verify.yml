name: Verify handoff and bench firmware
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts-and-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements.txt
      - run: bash tools/verify.sh
  esp32-bench-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.18
      - run: pio run -d firmware -j 2
  web-interface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  api-journeys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r apps/api/requirements.txt
      - run: python tools/qa_services.py start --config "$RUNNER_TEMP/smartclamp-qa.json"
      - run: python -m unittest discover -s apps/api/tests -v
        env:
          SMARTCLAMP_QA_CONFIG: ${{ runner.temp }}/smartclamp-qa.json
      - run: python tools/qa_services.py stop --config "$RUNNER_TEMP/smartclamp-qa.json"
        if: always()
