openapi: 3.0.3
info:
  title: SmartClamp API
  description: Normative builder contract revision 2. Source preserved in openapi.source.yaml.
    Device protocol and loop catalog are required companion specifications. No server
    implementation or production deployment implied.
  version: 2.0.0
servers:
- url: /api/v1
  description: Same-origin reverse-proxied API; configure deployment origin, never
    hardcode an unverified domain.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    deviceHmac:
      type: apiKey
      in: header
      name: X-Device-Signature
      description: HMAC-SHA256 of the request body, signed with the device's device_hmac_key
  schemas:
    UserRole:
      type: string
      enum:
      - tenant
      - landlord
      - homeowner
      - installer
      - agent
      - referrer
      - nepa_staff
      - internal_ops
      - internal_finance
      - internal_support
      - internal_engineering
      - internal_superadmin
    SubscriptionTier:
      type: string
      enum:
      - free
      - basic
      - basic_pro
      - pro
    DeviceRole:
      type: string
      enum:
      - transformer_monitor
      - pole_gateway
      - pole_device
      - house_full
      - building_hub
      - ir_reader
    MeterValidateRequest:
      type: object
      required:
      - meter_number
      properties:
        meter_number:
          type: string
        utility_type:
          type: string
          enum:
          - electricity
          - water
          - gas
          default: electricity
    MeterValidateResponse:
      type: object
      required:
      - valid
      properties:
        valid:
          type: boolean
        customer_name:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        disco_name:
          type: string
          nullable: true
        provider_name:
          type: string
          nullable: true
        utility_type:
          type: string
          enum:
          - electricity
          - water
          - gas
    SignupRequest:
      type: object
      required:
      - phone
      - password
      - full_name
      - role
      properties:
        phone:
          type: string
          example: '+2348012345678'
        password:
          type: string
          minLength: 8
        full_name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
    AuthResponse:
      type: object
      required:
      - user_id
      - role
      - access_token
      - refresh_token
      properties:
        user_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/UserRole'
        subscription_tier:
          $ref: '#/components/schemas/SubscriptionTier'
        access_token:
          type: string
        refresh_token:
          type: string
    LoginRequest:
      type: object
      required:
      - phone
      - password
      properties:
        phone:
          type: string
        password:
          type: string
    CreateBuildingRequest:
      type: object
      required:
      - name
      - address
      - meter_type
      properties:
        name:
          type: string
        address:
          type: string
        meter_type:
          type: string
          enum:
          - with_meter
          - no_meter
    CreateBuildingResponse:
      type: object
      properties:
        building_id:
          type: string
          format: uuid
    AddRoomRequest:
      type: object
      required:
      - label
      properties:
        label:
          type: string
          example: Room 3
    AddRoomResponse:
      type: object
      properties:
        room_id:
          type: string
          format: uuid
        invite_link:
          type: string
          format: uri
    RegisterDeviceRequest:
      type: object
      required:
      - role
      - has_relay
      - has_voltage_sensor
      properties:
        role:
          $ref: '#/components/schemas/DeviceRole'
        has_relay:
          type: boolean
        has_voltage_sensor:
          type: boolean
        room_id:
          type: string
          format: uuid
          nullable: true
        building_id:
          type: string
          format: uuid
          nullable: true
        pole_group_id:
          type: string
          format: uuid
          nullable: true
    RegisterDeviceResponse:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
        device_hmac_key_raw:
          type: string
          description: Returned exactly once. Burn into device firmware immediately.
            Never retrievable again.
    JoinRoomResponse:
      type: object
      properties:
        room_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - joined
          - room_already_claimed
    LinkMeterRequest:
      type: object
      required:
      - meter_number
      properties:
        meter_number:
          type: string
        disco_name:
          type: string
          nullable: true
        utility_type:
          type: string
          enum:
          - electricity
          - water
          - gas
          default: electricity
    LinkMeterResponse:
      type: object
      properties:
        linked_meter_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
          - link_confirmed_live
          - link_failed
        reason:
          type: string
          nullable: true
          example: meter_unreachable
    InitiateRechargeRequest:
      type: object
      required:
      - amount_naira
      - payment_method
      properties:
        amount_naira:
          type: number
          format: float
          minimum: 100
        payment_method:
          type: string
          enum:
          - card
          - bank_transfer
          - ussd
    InitiateRechargeResponse:
      type: object
      properties:
        checkout_url:
          type: string
          format: uri
        gateway_reference:
          type: string
    TenantDashboardResponse:
      type: object
      properties:
        wallet_balance:
          type: number
          format: float
        live_watts:
          type: number
          format: float
        relay_state:
          type: boolean
          nullable: true
        device_id:
          type: string
          format: uuid
        recent_alerts:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              severity:
                type: string
                enum:
                - info
                - warning
                - critical
              message:
                type: string
              created_at:
                type: string
                format: date-time
        nepa_verified:
          type: boolean
    FeatureFlagsResponse:
      type: object
      properties:
        active_flags:
          type: array
          items:
            type: string
    ConfirmCommandRequest:
      type: object
      required:
      - otp_code
      properties:
        otp_code:
          type: string
    Error:
      type: object
      properties:
        error:
          type: string
    DeviceReadingRequest:
      type: object
      required:
      - recorded_at
      - energy_kwh
      properties:
        recorded_at:
          type: string
          format: date-time
        voltage:
          type: number
          format: float
          nullable: true
        current_amps:
          type: number
          format: float
          nullable: true
        power_watts:
          type: number
          format: float
          nullable: true
        energy_kwh:
          type: number
          format: float
        relay_state:
          type: boolean
          nullable: true
    BillBreakdownResponse:
      type: object
      properties:
        flat_rate:
          type: boolean
        amount_naira:
          type: number
          format: float
          nullable: true
        breakdown:
          type: array
          items:
            type: object
            properties:
              tariff_name:
                type: string
              kwh:
                type: number
                format: float
              rate_per_kwh:
                type: number
                format: float
              subtotal_naira:
                type: number
                format: float
        total_naira:
          type: number
          format: float
          nullable: true
    ManualReadingResponse:
      type: object
      properties:
        status:
          type: string
    BillForecastResponse:
      type: object
      properties:
        projected_kwh:
          type: number
          format: float
        projected_cost_naira:
          type: number
          format: float
    CommunityOverviewResponse:
      type: object
      properties:
        transformer_count:
          type: integer
        total_consumption_kwh:
          type: number
          format: float
        active_tamper_flags:
          type: integer
    TamperFlagItem:
      type: object
      properties:
        alert_id:
          type: string
          format: uuid
        type:
          type: string
        severity:
          type: string
          enum:
          - info
          - warning
          - critical
        customer_name:
          type: string
          nullable: true
          description: Only populated if utility_control_consents shows active consent
        general_area:
          type: string
    GrantConsentResponse:
      type: object
      properties:
        status:
          type: string
    NepaCommandRequest:
      type: object
      required:
      - device_id
      - command
      properties:
        device_id:
          type: string
          format: uuid
        command:
          type: string
          enum:
          - relay_on
          - relay_off
    NepaCommandResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - pending_customer_confirmation
        command_token_id:
          type: string
          format: uuid
    BroadcastRequest:
      type: object
      required:
      - message
      properties:
        region:
          type: string
          nullable: true
        building_id:
          type: string
          format: uuid
          nullable: true
        message:
          type: string
    BroadcastResponse:
      type: object
      properties:
        broadcast_id:
          type: string
          format: uuid
        recipient_count:
          type: integer
    DisconnectionListRequest:
      type: object
      required:
      - min_days_overdue
      properties:
        min_days_overdue:
          type: integer
        region:
          type: string
          nullable: true
    DisconnectionListResponse:
      type: object
      properties:
        disconnection_list_id:
          type: string
          format: uuid
        item_count:
          type: integer
    RelayToggleRequest:
      type: object
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - 'on'
          - 'off'
    PendingConfirmationResponse:
      type: object
      properties:
        status:
          type: string
        command_token_id:
          type: string
          format: uuid
    ScheduleRequest:
      type: object
      required:
      - days_of_week
      - on_time
      - off_time
      properties:
        days_of_week:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
        on_time:
          type: string
          example: 06:00
        off_time:
          type: string
          example: '22:00'
    ScheduleResponse:
      type: object
      properties:
        schedule_id:
          type: string
          format: uuid
    BudgetRequest:
      type: object
      required:
      - monthly_limit_naira
      properties:
        monthly_limit_naira:
          type: number
          format: float
    BudgetResponse:
      type: object
      properties:
        daily_limit_units:
          type: number
          format: float
    LoadSignatureResponse:
      type: object
      properties:
        detected_appliances:
          type: array
          items:
            type: object
            properties:
              appliance:
                type: string
              confidence:
                type: number
                format: float
    PowerFactorResponse:
      type: object
      properties:
        power_factor:
          type: number
          format: float
          nullable: true
        flagged_inefficient:
          type: boolean
    UndersupplyCreditResponse:
      type: object
      properties:
        outage_hours:
          type: number
          format: float
        suggested_credit_naira:
          type: number
          format: float
        ready_to_submit_statement:
          type: boolean
    PeerBenchmarkResponse:
      type: object
      properties:
        your_usage_kwh:
          type: number
          format: float
        same_pole_average_kwh:
          type: number
          format: float
          nullable: true
        peer_count:
          type: integer
    ReportPreferencesRequest:
      type: object
      properties:
        auto_delivery_enabled:
          type: boolean
        frequency:
          type: string
          enum:
          - monthly
    AddViewerRequest:
      type: object
      required:
      - viewer_phone
      properties:
        viewer_phone:
          type: string
    MeetingViewResponse:
      type: object
      properties:
        usage_graph_data:
          type: array
          items:
            type: object
        bill_breakdown:
          $ref: '#/components/schemas/BillBreakdownResponse'
    VerificationReportResponse:
      type: object
      properties:
        microsite_url:
          type: string
          format: uri
    PortfolioDashboardResponse:
      type: object
      properties:
        buildings:
          type: array
          items:
            type: object
            properties:
              building_id:
                type: string
                format: uuid
              name:
                type: string
              occupied:
                type: integer
              total_rooms:
                type: integer
              revenue_naira:
                type: number
                format: float
              active_flags:
                type: integer
        portfolio_total_revenue_naira:
          type: number
          format: float
    CreateOrganizationRequest:
      type: object
      required:
      - name
      - subdomain
      properties:
        name:
          type: string
        subdomain:
          type: string
        primary_color_hex:
          type: string
          nullable: true
        logo_url:
          type: string
          nullable: true
    CreateOrganizationResponse:
      type: object
      properties:
        organization_id:
          type: string
          format: uuid
    OrganizationBrandingResponse:
      type: object
      properties:
        name:
          type: string
        logo_url:
          type: string
          nullable: true
        primary_color_hex:
          type: string
          nullable: true
    SavingsRecommendationItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recommendation_text:
          type: string
        estimated_savings_naira:
          type: number
          format: float
    NepaGenerateBillRequest:
      type: object
      required:
      - device_id
      - period_start
      - period_end
      properties:
        device_id:
          type: string
          format: uuid
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
    NepaGenerateBillResponse:
      type: object
      properties:
        bill_id:
          type: string
          format: uuid
        amount_naira:
          type: number
          format: float
    ApiError:
      type: object
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        retry_after_seconds:
          type: integer
          minimum: 0
      additionalProperties: false
    Accepted:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
        status:
          type: string
        version:
          type: integer
          minimum: 0
      additionalProperties: false
    DeviceEnvelope:
      type: object
      additionalProperties: false
      required:
      - device_id
      - key_epoch
      - payload_b64
      - signature
      properties:
        device_id:
          type: string
          format: uuid
        key_epoch:
          type: integer
          minimum: 1
        payload_b64:
          type: string
          maxLength: 16384
          description: Base64url no padding of signed canonical UTF-8 payload; see
            device-protocol.md
        signature:
          type: string
          pattern: ^[0-9a-f]{64}$
    Page:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        next_cursor:
          type: string
          nullable: true
        snapshot_version:
          type: integer
          minimum: 0
    Projection:
      type: object
      description: Exact logical fields and scope defined in ACCESS-MATRIX.md and
        DATA-CONTRACT.md; arbitrary secrets never included.
      required:
      - snapshot_version
      - generated_at
      - authorized_context
      properties:
        snapshot_version:
          type: integer
        generated_at:
          type: string
          format: date-time
        authorized_context:
          type: object
        devices:
          type: array
          items:
            type: object
        allowed_actions:
          type: array
          items:
            type: string
    StepUpRequest:
      type: object
      additionalProperties: false
      required:
      - operation_hash
      - scope_ids
      properties:
        operation_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
        scope_ids:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    PaymentStatus:
      type: object
      required:
      - id
      - payment_state
      - vending_state
      - credit_state
      properties:
        id:
          type: string
          format: uuid
        payment_state:
          type: string
          enum:
          - pending
          - verified
          - failed
          - refunded
          - chargeback
          - unknown
        vending_state:
          type: string
          enum:
          - not_required
          - pending
          - confirmed
          - token_pending_entry
          - failed
          - unknown
        credit_state:
          type: string
          enum:
          - reserved
          - available
          - reversed
          - none
        amount_kobo:
          type: integer
          minimum: 0
        units_mwh:
          type: integer
          minimum: 0
    QuoteRequest:
      type: object
      additionalProperties: false
      required:
      - destination_token
      - amount_kobo
      - utility_type
      properties:
        destination_token:
          type: string
        amount_kobo:
          type: integer
          minimum: 100
        utility_type:
          type: string
          enum:
          - electricity
          - water
          - gas
    Quote:
      type: object
      required:
      - id
      - expires_at
      - amount_kobo
      - wallet_value_kobo
      - markup_kobo
      - fee_kobo
      - units_mwh
      - tariff_version
      properties:
        amount_kobo:
          type: integer
          minimum: 0
        wallet_value_kobo:
          type: integer
          minimum: 0
        markup_kobo:
          type: integer
          minimum: 0
        fee_kobo:
          type: integer
          minimum: 0
        units_mwh:
          type: integer
          minimum: 0
        id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        tariff_version:
          type: string
    InviteRequest:
      type: object
      additionalProperties: false
      required:
      - room_id
      - expires_at
      properties:
        room_id: &id001
          type: string
          format: uuid
        expires_at: &id002
          type: string
          format: date-time
    DisputeCreate:
      type: object
      additionalProperties: false
      required:
      - bill_id
      - period_start
      - period_end
      properties:
        bill_id: *id001
        period_start: *id002
        period_end: *id002
        note:
          type: string
          maxLength: 4000
    SupportCreate:
      type: object
      additionalProperties: false
      required:
      - category
      - subject
      - message
      properties:
        category:
          type: string
          enum:
          - payment
          - device
          - billing
          - installation
          - account
          - other
        subject:
          type: string
          maxLength: 200
        message:
          type: string
          maxLength: 4000
        device_id: *id001
    CheckoutRequest:
      type: object
      additionalProperties: false
      required:
      - quote_id
      - return_path
      properties:
        quote_id: *id001
        return_path:
          type: string
          pattern: ^/[^/].*
    Message:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
          maxLength: 4000
        attachment_ids:
          type: array
          items: *id001
    DisputeResolve:
      type: object
      additionalProperties: false
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - accept_proposal
          - escalate
          - close_no_adjustment
        proposal_id: *id001
    TokenRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token: &id003
          type: string
    ChallengeVerify:
      type: object
      additionalProperties: false
      required:
      - code
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
    SessionRequest:
      type: object
      additionalProperties: false
      required:
      - token
      properties:
        token: *id003
    DeviceConfiguration:
      type: object
      additionalProperties: false
      required:
      - profile
      - config_epoch
      - config_sha256
      - diagnostics
      properties:
        profile:
          type: string
          enum:
          - transformer
          - pole_gateway
          - pole_device
          - house_full
          - building_hub
          - ir_reader
        config_epoch:
          type: integer
          minimum: 1
        config_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        diagnostics:
          type: object
          additionalProperties: true
    ExportRequest:
      type: object
      additionalProperties: false
      required:
      - scope_id
      - format
      - period_start
      - period_end
      properties:
        scope_id: *id001
        format:
          type: string
          enum:
          - pdf
          - csv
          - xlsx
        period_start: *id002
        period_end: *id002
    Preferences:
      type: object
      additionalProperties: false
      required:
      - language
      - email_enabled
      - sms_enabled
      - push_enabled
      properties:
        language:
          type: string
          enum:
          - en
        email_enabled:
          type: boolean
        sms_enabled:
          type: boolean
        push_enabled:
          type: boolean
    TelemetryAck:
      type: object
      additionalProperties: false
      properties:
        device_id:
          type: string
          format: uuid
        key_epoch:
          type: integer
          minimum: 1
        boot_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        seq:
          type: integer
          minimum: 1
        payload_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        committed:
          type: boolean
          enum:
          - true
      required:
      - device_id
      - key_epoch
      - boot_id
      - seq
      - payload_sha256
      - committed
    PollResponse:
      type: object
      additionalProperties: false
      properties:
        commands:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/DeviceEnvelope'
        acks:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/TelemetryAck'
        signed_time:
          $ref: '#/components/schemas/DeviceEnvelope'
      required:
      - commands
      - acks
      - signed_time
    PublicDeviceProjection:
      type: object
      additionalProperties: false
      properties:
        public_token: &id004
          type: string
        observed_at:
          type: string
          format: date-time
          nullable: true
        usage_watts:
          type: number
          nullable: true
        bill_amount_kobo:
          type: integer
          nullable: true
        device_status:
          type: string
          enum:
          - 'on'
          - 'off'
          - unknown
        quality: *id004
        payment_destination_token: *id004
      required:
      - public_token
      - observed_at
      - usage_watts
      - bill_amount_kobo
      - device_status
      - quality
      - payment_destination_token
    RecoveryRequest:
      type: object
      additionalProperties: false
      properties:
        phone_or_email: *id004
      required:
      - phone_or_email
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 1
      required:
      - refresh_token
    DeviceDetail:
      type: object
      required:
      - id
      - profile
      - capabilities
      - config_epoch
      - calibration_status
      - last_seen_at
      properties:
        id:
          type: string
          format: uuid
        profile:
          type: string
        capabilities:
          type: array
          items:
            type: string
        config_epoch:
          type: integer
        calibration_status:
          type: string
          enum:
          - qualified
          - uncalibrated
          - expired
          - failed
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        projection:
          $ref: '#/components/schemas/Projection'
    PlanChange:
      type: object
      additionalProperties: false
      required:
      - plan
      - cadence
      - expected_version
      properties:
        plan:
          type: string
          enum:
          - basic
          - basic_pro
          - pro
        cadence:
          type: string
          enum:
          - monthly
          - quarterly
          - yearly
        expected_version:
          type: integer
          minimum: 1
    OrderRequest:
      type: object
      additionalProperties: false
      required:
      - profile
      - service_address
      - contact_phone
      properties:
        profile:
          type: string
          enum:
          - pole_gateway
          - pole_device
          - house_full
          - building_hub
          - ir_reader
        service_address:
          type: string
          maxLength: 1000
        contact_phone:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
        notes:
          type: string
          maxLength: 2000
    VersionedAction:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - action
      properties:
        expected_version:
          type: integer
          minimum: 1
        action:
          type: string
        note:
          type: string
          maxLength: 4000
    AttachmentRequest:
      type: object
      additionalProperties: false
      required:
      - case_id
      - content_type
      - size_bytes
      - sha256
      properties:
        case_id:
          type: string
          format: uuid
        content_type:
          type: string
          enum:
          - image/jpeg
          - image/png
          - application/pdf
        size_bytes:
          type: integer
          minimum: 1
          maximum: 10485760
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
