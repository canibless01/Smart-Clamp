      operationId: get_payments__payment_id__transfer_instructions
      summary: Own provider-generated transfer instructions
      description: Provider account/reference/amount/expiry plus payment status; no
        static personal bank destination; public payer uses scoped status token companion.
      security:
      - bearerAuth: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Authorized result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        default:
          description: Structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /public/payments/{status_token}/transfer-instructions:
    get:
      operationId: get_public_payments__status_token__transfer_instructions
      summary: Opaque payer transfer instructions
      description: Actor scope and state transitions in ACCESS-MATRIX/LOOP-CATALOG;
        no implicit authorization from ID possession.
      security: []
      parameters:
      - name: status_token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Authorized result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        default:
          description: Structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
security:
- bearerAuth: []
