[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps = bblanchon/ArduinoJson@6.21.5
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra

[env:transformer]
build_flags = ${env.build_flags} -DDEVICE_ROLE=0
[env:pole_gateway]
build_flags = ${env.build_flags} -DDEVICE_ROLE=1
[env:pole_device]
build_flags = ${env.build_flags} -DDEVICE_ROLE=2
[env:house_full]
build_flags = ${env.build_flags} -DDEVICE_ROLE=3
[env:building_hub]
build_flags = ${env.build_flags} -DDEVICE_ROLE=4
[env:ir_reader]
build_flags = ${env.build_flags} -DDEVICE_ROLE=5
