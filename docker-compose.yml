# Application services use an existing, configured Supabase PostgreSQL/Auth project.
# Test-only PostgreSQL/GoTrue services are started by tools/qa_services.py instead.
x-api-image: &api-image
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    secrets: [proxy_ca]
  image: smartclamp-api:local
  env_file: .env
services:
  migrate:
    <<: *api-image
    profiles: [tools]
    command: python /app/tools/migrate.py
  api:
    <<: *api-image
    ports: ["5000:5000"]
    restart: unless-stopped
  worker:
    <<: *api-image
    command: python /app/services/worker/worker.py
    restart: unless-stopped
  web:
    build:
      context: ./apps/web
      secrets: [proxy_ca]
      args:
        NEXT_PUBLIC_API_BASE: /api/v1
        API_PROXY_TARGET: http://api:5000
        SITE_URL: ${SITE_URL:-}
    ports: ["3000:3000"]
    environment:
      API_PROXY_TARGET: http://api:5000
    depends_on: [api]
    restart: unless-stopped
secrets:
  proxy_ca:
    file: ${BUILD_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
